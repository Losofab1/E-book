spring.application.name=Biblioth
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.jpa.open-in-view=false
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://e-book-steel-nu.vercel.app}

# Mail / frontend settings for password reset (production defaults only)
app.frontend.url=${FRONTEND_URL:https://e-book-steel-nu.vercel.app}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
