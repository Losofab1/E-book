name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -f PROJET_JAVA/Biblioth/pom.xml test --no-transfer-progress

      - name: Package application
        run: mvn -f PROJET_JAVA/Biblioth/pom.xml clean package -DskipTests --no-transfer-progress

      - name: Build Docker image
        run: docker build -f PROJET_JAVA/Dockerfile -t biblioth:latest PROJET_JAVA
